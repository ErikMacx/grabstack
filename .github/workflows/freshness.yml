name: Freshness check

# "Regularly checked" — this is the part that reports on itself. Runs every
# Monday and changes nothing; it makes the staleness visible in the Actions log.
# The weekly review (weekly-review.yml) now works through whatever it lists, so
# this no longer fails the run when entries are overdue.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Report freshness
        run: node scripts/freshness.mjs
