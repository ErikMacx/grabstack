name: Weekly review of GrabStack

# Every Monday at 06:37 UTC, Claude re-checks the tool entries and stacks past their review-by date, fills gaps in Frontier,
# refreshes the Landscape and, on the first Monday of the month, the Learning pages,
# following CLAUDE.md's "Weekly review procedure". If the build passes and the run touched only content,
# it is committed to main and deployed to Cloudflare Pages straight away. If anything fails,
# nothing is published and GitHub emails the failure. Run it by hand from the Actions tab.

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional: anything to cover first (e.g. 'the Landscape and Learning pages')"
        required: false
        default: ""

concurrency:
  group: grabstack-content
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Today's date
        id: today
        run: |
          echo "iso=$(date -u '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "label=$(date -u '+%-d %B %Y')" >> "$GITHUB_OUTPUT"

      - name: Update GrabStack with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are maintaining GrabStack in this repository. Today is ${{ steps.today.outputs.label }} (${{ steps.today.outputs.iso }}).
            Read CLAUDE.md in full, then carry out the "Weekly review procedure" exactly, obeying every editorial rule.
            Focus for this run (may be empty; if given, do it first, and it may include the Learning pages on any day): ${{ github.event.inputs.focus }}
            Touch only files under src/content/, src/data/ai-landscape.json, src/pages/learning/ and REVIEW_NOTES.md.
            Finish by running `npm run build` until it passes.
            Do not commit or push; the workflow does that.
          claude_args: |
            --max-turns 200
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,TodoWrite,Bash(date:*),Bash(npm run build:*),Bash(npm run freshness:*),Bash(node scripts/freshness.mjs:*),Bash(git diff:*),Bash(git status:*),Bash(ls:*),Bash(wc:*)"

      - name: Show why Claude stopped
        if: failure()
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          if [ -f "$f" ]; then
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); d=d if isinstance(d,list) else [d]; [print("Claude said:", m.get("result") or m.get("error") or "(no message)") for m in d if isinstance(m,dict) and m.get("type")=="result"]' "$f"
          else
            echo "No execution log was written."
          fi

      - name: Only content changed
        run: scripts/guard_changes.sh '^(src/content/.*|src/data/ai-landscape\.json|src/pages/learning(/[^/]+)?\.astro|REVIEW_NOTES\.md)$'

      - name: Build
        run: npm run build

      - name: Commit to main
        id: publish
        run: |
          cat REVIEW_NOTES.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          scripts/publish.sh "Weekly review: ${{ steps.today.outputs.label }}"

      - name: Deploy to Cloudflare Pages
        if: steps.publish.outputs.published == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=grabstack --branch=main
